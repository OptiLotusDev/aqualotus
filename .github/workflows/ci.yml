name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Skip redundant runs: a branch freshly cut from dev with no new changes
  # was already tested as dev (pushing the branch still fires `on: push`).
  # Fail open (run) on any doubt. PRs, dispatches, and pushes to main/dev
  # always run.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${{ github.ref }}" in
            refs/heads/main|refs/heads/dev)
              echo "code=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          git fetch origin dev --quiet || true
          if ! git rev-parse --verify --quiet refs/remotes/origin/dev >/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git merge-base --is-ancestor HEAD refs/remotes/origin/dev; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          elif git diff --quiet refs/remotes/origin/dev HEAD; then
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  # Optilotus engine: headless proof. The runtime must never depend on
  # the UI, Tauri, React, or a browser (roadmap invariants 1/11, P11/P12).
  # Plain `cargo test --workspace` excludes the Tauri shell by design
  # (see root Cargo.toml `exclude`).
  rust-core:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # Web: the one shared React app + WASM bridge (works today).
  # Covers `lint`, `test:ui`, and the production `build`
  # (which rebuilds WASM via `build:wasm`, then `tsc -b` + `vite build`).
  # Skipped together with rust-core when there is nothing new to test;
  # desktop/mobile cascade from these two, so they skip as well.
  web:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/aqualotus-ui/package-lock.json
      - name: Install UI deps
        working-directory: apps/aqualotus-ui
        run: npm ci
      - name: Lint
        working-directory: apps/aqualotus-ui
        run: npm run lint
      - name: Test UI
        working-directory: apps/aqualotus-ui
        run: npm run test:ui
      - name: Build web
        working-directory: apps/aqualotus-ui
        run: npm run build

  # Desktop: same UI packed by Tauri 2 (Windows / macOS / Linux).
  # Runs only after core + web are green to save native build minutes.
  desktop:
    needs: [rust-core, web]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/aqualotus-ui/package-lock.json
      - name: Install Tauri OS libraries (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Install UI deps
        working-directory: apps/aqualotus-ui
        run: npm ci
      - name: Build desktop bundle
        working-directory: apps/aqualotus-ui
        run: npm run tauri:build

  # Mobile/Android: same frontend + Optilotus synced via Capacitor,
  # then assembled with Gradle. Needs Android SDK + Java 17.
  android:
    needs: [rust-core, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/aqualotus-ui/package-lock.json
      - uses: actions/setup-java@v5
        with:
          # Capacitor 8 targets Java 21 (compileDebugJavaWithJavac fails
          # on 17 with "invalid source release: 21").
          distribution: temurin
          java-version: 21
      - name: Set up Android SDK
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)
          
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            echo "ANDROID_HOME=$ANDROID_HOME"
            find "$ANDROID_HOME" -maxdepth 4 -type f | head -n 100
            exit 1
          fi
          
          echo "Using sdkmanager: $SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0"
      - name: Install UI deps
        working-directory: apps/aqualotus-ui
        run: npm ci
      - name: Sync Capacitor assets
        working-directory: apps/aqualotus-ui
        run: npm run mobile:sync
      - name: Assemble debug APK
        working-directory: apps/aqualotus-ui/android
        run: ./gradlew assembleDebug --no-daemon

  # Mobile/iOS: same frontend + Optilotus synced via Capacitor,
  # then compiled with Xcode (macOS only, no signing).
  ios:
    needs: [rust-core, web]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/aqualotus-ui/package-lock.json
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install UI deps
        working-directory: apps/aqualotus-ui
        run: npm ci
      - name: Sync Capacitor assets
        working-directory: apps/aqualotus-ui
        run: npm run mobile:sync
      - name: Build iOS app (no signing)
        working-directory: apps/aqualotus-ui
        run: >
          xcodebuild
          -project ios/App/App.xcodeproj
          -scheme App
          -configuration Debug
          -destination 'generic/platform=iOS'
          build-for-testing
          CODE_SIGNING_ALLOWED=NO
