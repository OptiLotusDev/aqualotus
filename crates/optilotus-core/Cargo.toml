[package]
name = "optilotus-core"
version = "0.5.1"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-compat"], optional = true }

[features]
# TypeScript binding generation for the DTOs the bridge serializes. Off by
# default so the shipped wasm binary never links a build-time codegen tool.
ts-bindings = ["dep:ts-rs"]
