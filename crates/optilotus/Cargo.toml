[package]
name = "optilotus"
version = "0.5.1"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
optilotus-core = { path = "../optilotus-core" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
ts-rs = { version = "12", features = ["serde-compat"], optional = true }

[features]
# TypeScript binding generation. Off by default so the shipped wasm
# binary never links a build-time codegen tool (P11/P12).
ts-bindings = ["dep:ts-rs", "optilotus-core/ts-bindings"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
