[workspace]
members = ["crates/optilotus", "crates/optilotus-data", "crates/optilotus-core"]
# The Tauri desktop shell manages its own build via the Tauri CLI.
# Excluding it keeps plain `cargo test/build --workspace` (web + engine
# workflows) from requiring Tauri's OS libraries.
exclude = ["apps/aqualotus-ui/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
